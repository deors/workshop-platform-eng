name: Azure - Provision & Reconcile Application Resources

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name (short, lowercase, no spaces)"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [dev, staging, prod, all]
        required: true
        default: dev
      azure_tenant_id:
        description: "Azure Tenant ID"
        type: string
        required: true
      azure_subscription_id:
        description: "Azure Subscription ID"
        type: string
        required: true
      azure_client_id:
        description: "Client ID of the Azure service principal / managed identity used for OIDC login"
        type: string
        required: true
      azure_location:
        description: "Azure region for all the resources (e.g. westeurope)"
        type: string
        required: true
      infra_template_repo:
        description: "Template repo for the infrastructure (e.g. owner/template-terraform-azure-webapp)"
        type: string
        required: true
      infra_template_ref:
        description: "Git ref (tag, branch, or commit SHA) to pin the infra template; leave empty to use the template's default branch latest commit"
        type: string
        required: false
        default: ""
      app_template_repo:
        description: "Template repo for the application source (e.g. owner/template-helloworld-express); leave empty to skip the application repository phase"
        type: string
        required: false
        default: ""
      app_template_ref:
        description: "Git ref (tag, branch, or commit SHA) to pin the app template; leave empty to use the template's default branch latest commit"
        type: string
        required: false
        default: ""
      container_image:
        description: "Container image reference, without the registry host (e.g. owner/template-helloworld-express:sha-af53b68); ignored in reconcile runs — Terraform's lifecycle keeps the image last set by CI/CD workflows"
        type: string
        required: true
      container_registry_url:
        description: "Container registry URL (e.g. ghcr.io); leave empty for public Docker Hub images; ignored in reconcile runs"
        type: string
        required: true
      ci_workflow_file:
        description: "Filename of the CI workflow inside the application repo (e.g. ci.yml)"
        type: string
        required: false
        default: ci.yml

  repository_dispatch:
    types:
      - azure-provision-infrastructure

# Permissions required for OIDC login and SARIF upload to Security tab.
permissions:
  id-token:        write
  contents:        read
  security-events: write

concurrency:
  group: provision-azure-${{ github.event.inputs.app_name || github.event.client_payload.app_name }}
  cancel-in-progress: false   # never cancel an in-flight provision

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Resolve & validate inputs from either trigger source
  # ────────────────────────────────────────────────────────────────────────────
  resolve-inputs:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      app_name:                ${{ steps.params.outputs.app_name }}
      environments:            ${{ steps.matrix.outputs.environments }}
      azure_tenant_id:         ${{ steps.params.outputs.azure_tenant_id }}
      azure_subscription_id:   ${{ steps.params.outputs.azure_subscription_id }}
      azure_client_id:         ${{ steps.params.outputs.azure_client_id }}
      azure_location:          ${{ steps.params.outputs.azure_location }}
      infra_template_repo:     ${{ steps.params.outputs.infra_template_repo }}
      app_template_repo:       ${{ steps.params.outputs.app_template_repo }}
      infra_template_ref:      ${{ steps.params.outputs.infra_template_ref }}
      app_template_ref:        ${{ steps.params.outputs.app_template_ref }}
      with_app_repo:           ${{ steps.params.outputs.with_app_repo }}
      container_image:         ${{ steps.params.outputs.container_image }}
      container_registry_url:  ${{ steps.params.outputs.container_registry_url }}
      ci_workflow_file:        ${{ steps.params.outputs.ci_workflow_file }}
      tfstate_storage_account: ${{ steps.tfstate_names.outputs.storage_account }}
      tfstate_resource_group:  ${{ steps.tfstate_names.outputs.resource_group }}
      infra_repo_full:         ${{ steps.params.outputs.infra_repo_full }}
      app_repo_full:           ${{ steps.params.outputs.app_repo_full }}

    steps:
      - name: Extract and validate parameters
        id: params
        env:
          # workflow_dispatch values
          WD_APP:                ${{ github.event.inputs.app_name }}
          WD_ENV:                ${{ github.event.inputs.environment }}
          WD_TENANT_ID:          ${{ github.event.inputs.azure_tenant_id }}
          WD_SUB_ID:             ${{ github.event.inputs.azure_subscription_id }}
          WD_CLIENT_ID:          ${{ github.event.inputs.azure_client_id }}
          WD_AZURE_LOCATION:     ${{ github.event.inputs.azure_location }}
          WD_INFRA_TEMPLATE:     ${{ github.event.inputs.infra_template_repo }}
          WD_INFRA_TEMPLATE_REF: ${{ github.event.inputs.infra_template_ref }}
          WD_APP_TEMPLATE:       ${{ github.event.inputs.app_template_repo }}
          WD_APP_TEMPLATE_REF:   ${{ github.event.inputs.app_template_ref }}
          WD_IMAGE:              ${{ github.event.inputs.container_image }}
          WD_REGISTRY:           ${{ github.event.inputs.container_registry_url }}
          WD_CI_FILE:            ${{ github.event.inputs.ci_workflow_file }}
          # repository_dispatch values (client_payload)
          RD_APP:                ${{ github.event.client_payload.app_name }}
          RD_ENV:                ${{ github.event.client_payload.environment }}
          RD_TENANT_ID:          ${{ github.event.client_payload.azure_tenant_id }}
          RD_SUB_ID:             ${{ github.event.client_payload.azure_subscription_id }}
          RD_CLIENT_ID:          ${{ github.event.client_payload.azure_client_id }}
          RD_AZURE_LOCATION:     ${{ github.event.client_payload.azure_location }}
          RD_INFRA_TEMPLATE:     ${{ github.event.client_payload.infra_template_repo }}
          RD_INFRA_TEMPLATE_REF: ${{ github.event.client_payload.infra_template_ref }}
          RD_APP_TEMPLATE:       ${{ github.event.client_payload.app_template_repo }}
          RD_APP_TEMPLATE_REF:   ${{ github.event.client_payload.app_template_ref }}
          RD_IMAGE:              ${{ github.event.client_payload.container_image }}
          RD_REGISTRY:           ${{ github.event.client_payload.container_registry_url }}
          RD_CI_FILE:            ${{ github.event.client_payload.ci_workflow_file }}
          OWNER:                 ${{ github.repository_owner }}
        run: |
          APP_NAME="${WD_APP:-$RD_APP}"
          ENVIRONMENT="${WD_ENV:-$RD_ENV}"
          AZURE_TENANT_ID="${WD_TENANT_ID:-$RD_TENANT_ID}"
          AZURE_SUBSCRIPTION_ID="${WD_SUB_ID:-$RD_SUB_ID}"
          AZURE_CLIENT_ID="${WD_CLIENT_ID:-$RD_CLIENT_ID}"
          AZURE_LOCATION="${WD_AZURE_LOCATION:-$RD_AZURE_LOCATION}"
          INFRA_TEMPLATE_REPO="${WD_INFRA_TEMPLATE:-$RD_INFRA_TEMPLATE}"
          INFRA_TEMPLATE_REF="${WD_INFRA_TEMPLATE_REF:-$RD_INFRA_TEMPLATE_REF}"
          APP_TEMPLATE_REPO="${WD_APP_TEMPLATE:-$RD_APP_TEMPLATE}"
          APP_TEMPLATE_REF="${WD_APP_TEMPLATE_REF:-$RD_APP_TEMPLATE_REF}"
          CONTAINER_IMAGE="${WD_IMAGE:-$RD_IMAGE}"
          CONTAINER_REGISTRY_URL="${WD_REGISTRY:-$RD_REGISTRY}"
          CI_WORKFLOW_FILE="${WD_CI_FILE:-${RD_CI_FILE:-ci.yml}}"

          MISSING=()
          [[ -z "$APP_NAME"               ]] && MISSING+=(app_name)
          [[ -z "$ENVIRONMENT"            ]] && MISSING+=(environment)
          [[ -z "$AZURE_TENANT_ID"        ]] && MISSING+=(azure_tenant_id)
          [[ -z "$AZURE_SUBSCRIPTION_ID"  ]] && MISSING+=(azure_subscription_id)
          [[ -z "$AZURE_CLIENT_ID"        ]] && MISSING+=(azure_client_id)
          [[ -z "$AZURE_LOCATION"         ]] && MISSING+=(azure_location)
          [[ -z "$INFRA_TEMPLATE_REPO"    ]] && MISSING+=(infra_template_repo)
          [[ -z "$CONTAINER_IMAGE"        ]] && MISSING+=(container_image)
          [[ -z "$CONTAINER_REGISTRY_URL" ]] && MISSING+=(container_registry_url)
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required parameters: ${MISSING[*]}"
            exit 1
          fi

          # Presence of app_template_repo controls whether the application
          # repository phase runs; omitting it provisions infra only.
          WITH_APP_REPO=false
          [[ -n "$APP_TEMPLATE_REPO" ]] && WITH_APP_REPO=true

          # Validate app_name: lowercase alphanumeric + hyphens only
          if ! [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$ ]]; then
            echo "::error::app_name must be 3–22 chars, lowercase alphanumeric and hyphens, no leading/trailing hyphen"
            exit 1
          fi

          # Note: azure_tenant_id, azure_subscription_id, azure_client_id are GUIDs that
          # identify Azure resources/principals. They are not secrets in an OIDC flow
          # (security comes from the federated credential subject claim). They are
          # NOT masked here because GitHub Actions blanks masked values when they
          # flow through job outputs to downstream jobs.

          echo "app_name=$APP_NAME"                             >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT"                       >> "$GITHUB_OUTPUT"
          echo "azure_tenant_id=$AZURE_TENANT_ID"               >> "$GITHUB_OUTPUT"
          echo "azure_subscription_id=$AZURE_SUBSCRIPTION_ID"   >> "$GITHUB_OUTPUT"
          echo "azure_client_id=$AZURE_CLIENT_ID"               >> "$GITHUB_OUTPUT"
          echo "azure_location=$AZURE_LOCATION"                 >> "$GITHUB_OUTPUT"
          echo "infra_template_repo=$INFRA_TEMPLATE_REPO"       >> "$GITHUB_OUTPUT"
          echo "infra_template_ref=$INFRA_TEMPLATE_REF"         >> "$GITHUB_OUTPUT"
          echo "app_template_repo=$APP_TEMPLATE_REPO"           >> "$GITHUB_OUTPUT"
          echo "app_template_ref=$APP_TEMPLATE_REF"             >> "$GITHUB_OUTPUT"
          echo "with_app_repo=$WITH_APP_REPO"                   >> "$GITHUB_OUTPUT"
          echo "container_image=$CONTAINER_IMAGE"               >> "$GITHUB_OUTPUT"
          echo "container_registry_url=$CONTAINER_REGISTRY_URL" >> "$GITHUB_OUTPUT"
          echo "ci_workflow_file=$CI_WORKFLOW_FILE"             >> "$GITHUB_OUTPUT"
          echo "infra_repo_full=${OWNER}/${APP_NAME}-infra"     >> "$GITHUB_OUTPUT"
          echo "app_repo_full=${OWNER}/${APP_NAME}"             >> "$GITHUB_OUTPUT"

      - name: Derive tfstate resource names
        id: tfstate_names
        env:
          APP_NAME:              ${{ steps.params.outputs.app_name }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.params.outputs.azure_subscription_id }}
        run: |
          # Must match the formula in scripts/bootstrap-tfstate-azure.sh exactly
          APP_SHORT=$(echo "$APP_NAME"              | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-12)
          SUB_SHORT=$(echo "$AZURE_SUBSCRIPTION_ID" | tr -d '-'                              | cut -c1-8)
          echo "storage_account=sttf${APP_SHORT}${SUB_SHORT}" >> "$GITHUB_OUTPUT"
          echo "resource_group=rg-${APP_NAME}-tfstate"        >> "$GITHUB_OUTPUT"

      - name: Build environment matrix
        id: matrix
        env:
          ENVIRONMENT: ${{ steps.params.outputs.environment }}
        run: |
          if [[ "$ENVIRONMENT" == "all" ]]; then
            echo 'environments=["dev","staging","prod"]' >> "$GITHUB_OUTPUT"
          else
            echo "environments=[\"$ENVIRONMENT\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          APP_NAME:       ${{ steps.params.outputs.app_name }}
          ENVIRONMENT:    ${{ steps.params.outputs.environment }}
          LOCATION:       ${{ steps.params.outputs.azure_location }}
          IMAGE:          ${{ steps.params.outputs.container_image }}
          REGISTRY:       ${{ steps.params.outputs.container_registry_url }}
          TRIGGER:        ${{ github.event_name }}
          WITH_APP_REPO:  ${{ steps.params.outputs.with_app_repo }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Provision Infrastructure (Azure)

          | Parameter        | Value               |
          |------------------|---------------------|
          | Trigger          | \`$TRIGGER\`        |
          | App name         | \`$APP_NAME\`       |
          | Environment      | \`$ENVIRONMENT\`    |
          | Location         | \`$LOCATION\`       |
          | Image            | \`$IMAGE\`          |
          | Registry         | \`$REGISTRY\`       |
          | App repo phase   | \`$WITH_APP_REPO\`  |
          EOF

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Preflight existence checks — confirm the template repos (and any
  #    pinned refs) exist and the container image is anonymously pullable
  #    BEFORE anything is created. A mistyped value otherwise only surfaces
  #    as a checkout failure mid-run — or worse, as a service waiting forever
  #    for an image it can never pull. All findings are reported together in
  #    the job summary. Gating create-infra-repo gates the entire downstream
  #    graph, so nothing runs on bad inputs.
  #
  #    The repo checks use GH_PAT when configured (proving the accessibility
  #    the app phase will need) and fall back to the workflow token, keeping
  #    infra-only setups PAT-free as documented in setup-github.md.
  #
  #    The job also enforces the environment promotion order (P16): staging
  #    cannot be first-provisioned before dev, nor prod before dev + staging.
  # ────────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight checks
    needs: resolve-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for helper script)
        uses: actions/checkout@v6

      - name: Verify template repos and container image
        env:
          GH_TOKEN:            ${{ secrets.GH_PAT || github.token }}
          INFRA_TEMPLATE_REPO: ${{ needs.resolve-inputs.outputs.infra_template_repo }}
          INFRA_TEMPLATE_REF:  ${{ needs.resolve-inputs.outputs.infra_template_ref }}
          APP_TEMPLATE_REPO:   ${{ needs.resolve-inputs.outputs.app_template_repo }}
          APP_TEMPLATE_REF:    ${{ needs.resolve-inputs.outputs.app_template_ref }}
          IMAGE:               ${{ needs.resolve-inputs.outputs.container_image }}
          REGISTRY:            ${{ needs.resolve-inputs.outputs.container_registry_url }}
        run: |
          export CONTAINER_IMAGE_FULL="${REGISTRY:+${REGISTRY}/}${IMAGE}"
          scripts/preflight-inputs.sh

      # The promotion gate below reads the tfstate backend, which needs a
      # cloud login. This job never binds a GitHub Environment, so the
      # branch-scoped federated credential authenticates it — the same
      # subject every other non-environment job uses.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          tenant-id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          client-id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

      - name: Environment promotion gate
        env:
          ENVS_JSON:       ${{ needs.resolve-inputs.outputs.environments }}
          STORAGE_ACCOUNT: ${{ needs.resolve-inputs.outputs.tfstate_storage_account }}
        run: |
          set -euo pipefail

          # Promotion order is dev → staging → prod: staging cannot be
          # first-provisioned before dev, nor prod before dev + staging. A
          # prerequisite counts as satisfied when it is part of this same
          # request (so 'all' always passes, with no lookups) or already
          # provisioned. Reconciling an environment that already exists is
          # always allowed, even if a prerequisite has since been deleted —
          # the gate orders FIRST provisioning, it does not police steady
          # state. "Already provisioned" is judged from the tfstate backend,
          # the only signal that also works for infra-only runs.
          ENVS=$(jq -r '.[]' <<<"$ENVS_JSON")
          in_set() { grep -qx "$1" <<<"$ENVS"; }

          # Evidence: every verdict lands in the job summary, pass or fail,
          # in the same table style as the other preflight checks.
          ROWS=()
          GATE_RC=0
          note() { ROWS+=("$1	$2	$3"); }
          summary() {
            {
              echo "## Environment promotion gate"
              echo ""
              echo "| Result | Environment | Detail |"
              echo "|--------|-------------|--------|"
              local ROW S E D
              for ROW in "${ROWS[@]}"; do
                IFS=$'\t' read -r S E D <<<"$ROW"
                echo "| $S | $E | $D |"
              done
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          exists() {
            local BLOB="$1/terraform.tfstate" OUT
            # Classify failures: a missing account/container means "not
            # provisioned", but an auth or transport error must fail the gate
            # loudly — never be misread as "environment missing".
            if ! OUT=$(az storage blob exists \
                         --account-name   "$STORAGE_ACCOUNT" \
                         --container-name tfstate \
                         --name           "$BLOB" \
                         --auth-mode      login \
                         --query exists --output tsv 2>&1); then
              if grep -qiE "ResourceNotFound|StorageAccountNotFound|ContainerNotFound|does not exist|not found" <<<"$OUT"; then
                return 1
              fi
              OUT=$(tr '\n' ' ' <<<"$OUT" | tr '|' '/')
              note "❌" "$1" "state backend query failed: ${OUT}"
              summary
              echo "::error::Environment promotion gate could not check '$1' (state backend query failed): ${OUT}"
              exit 1
            fi
            [[ "$OUT" == "true" ]]
          }

          require() {
            local TARGET="$1"; shift
            in_set "$TARGET" || return 0
            local DETAIL=() MISSING=() P
            for P in "$@"; do
              if in_set "$P"; then
                DETAIL+=("'$P' provisioned in this same run")
              elif exists "$P"; then
                DETAIL+=("'$P' already provisioned")
              else
                MISSING+=("$P")
              fi
            done
            if [[ ${#MISSING[@]} -eq 0 ]]; then
              local JOINED; JOINED=$(printf '%s; ' "${DETAIL[@]}"); JOINED="${JOINED%; }"
              note "✅" "$TARGET" "$JOINED"
              return 0
            fi
            if exists "$TARGET"; then
              note "✅" "$TARGET" "already provisioned — reconcile allowed although prerequisite(s) no longer exist: ${MISSING[*]}"
              echo "'$TARGET' is already provisioned — reconcile allowed although prerequisite(s) no longer exist: ${MISSING[*]}"
              return 0
            fi
            note "❌" "$TARGET" "prerequisite environment(s) not provisioned yet: ${MISSING[*]} — provision ${MISSING[*]} first, or request 'all'"
            echo "::error::Environment promotion gate: '$TARGET' requested, but prerequisite environment(s) not provisioned yet: ${MISSING[*]}. Provision ${MISSING[*]} first, or request 'all'."
            GATE_RC=1
          }

          in_set dev && note "✅" "dev" "no prerequisites — promotion order starts here"
          require staging dev
          require prod dev staging

          summary
          [[ "$GATE_RC" -eq 0 ]] && echo "Environment promotion gate passed."
          exit "$GATE_RC"

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Create infrastructure repository from template (idempotent)
  # ────────────────────────────────────────────────────────────────────────────
  create-infra-repo:
    name: Create infrastructure repo
    needs: [resolve-inputs, preflight]
    runs-on: ubuntu-latest
    outputs:
      infra_repo_existed: ${{ steps.create.outputs.repo_existed }}

    steps:
      - name: Create from template
        id: create
        env:
          GH_TOKEN:      ${{ secrets.GH_PAT }}
          OWNER:         ${{ github.repository_owner }}
          APP_NAME:      ${{ needs.resolve-inputs.outputs.app_name }}
          REPO_FULL:     ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          TEMPLATE:      ${{ needs.resolve-inputs.outputs.infra_template_repo }}
          TEMPLATE_REF:  ${{ needs.resolve-inputs.outputs.infra_template_ref }}
        run: |
          if gh api "repos/${REPO_FULL}" --silent 2>/dev/null; then
            echo "Repository ${REPO_FULL} already exists — skipping creation"
            echo "repo_existed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Creating ${REPO_FULL} from template ${TEMPLATE}…"
          gh api -X POST "repos/${TEMPLATE}/generate" \
            -f "owner=${OWNER}" \
            -f "name=${APP_NAME}-infra" \
            -f "description=Infrastructure repository for ${APP_NAME} (provisioned by platform-eng)" \
            -F "private=false" \
            -F "include_all_branches=false"

          # The "generate" endpoint is async. Wait until the repo exists AND
          # its default branch is queryable so downstream actions/checkout sees
          # an actual branch tip rather than a half-created repository.
          READY=false
          for _ in $(seq 1 30); do
            DEFAULT_BRANCH=$(gh api "repos/${REPO_FULL}" --jq '.default_branch // ""' 2>/dev/null || true)
            if [[ -n "$DEFAULT_BRANCH" ]] && gh api "repos/${REPO_FULL}/branches/${DEFAULT_BRANCH}" --silent 2>/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo "::error::Repository ${REPO_FULL} was created but its default branch did not become ready in time"
            exit 1
          fi

          # Pin the repo contents to a specific template ref if requested.
          # GitHub's generate endpoint always seeds from the template's default
          # branch; to honour a pinned tag/branch/SHA we clone the template at
          # that exact ref and force-push its content onto the new repo's
          # default branch — squashed to a single parentless commit, so the
          # repo keeps the one-commit shape the generate endpoint produces
          # instead of inheriting the template's full history.
          if [[ -n "$TEMPLATE_REF" ]]; then
            echo "Pinning ${REPO_FULL} to template ref ${TEMPLATE_REF}…"
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE}.git" \
              /tmp/template-infra-pin
            git -C /tmp/template-infra-pin checkout "${TEMPLATE_REF}"
            git -C /tmp/template-infra-pin remote add target \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL}.git"
            # commit-tree builds the parentless commit; the resolved SHA in
            # its message records exactly which template commit the content
            # came from, even if the pinned ref was a branch or tag that
            # later moves.
            git -C /tmp/template-infra-pin config user.name  "github-actions[bot]"
            git -C /tmp/template-infra-pin config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PIN_SHA=$(git -C /tmp/template-infra-pin rev-parse HEAD)
            PIN_COMMIT=$(git -C /tmp/template-infra-pin commit-tree "HEAD^{tree}" \
              -m "Initial commit from ${TEMPLATE}@${PIN_SHA} (requested ref: ${TEMPLATE_REF})")
            git -C /tmp/template-infra-pin push --force target \
              "${PIN_COMMIT}:refs/heads/${DEFAULT_BRANCH}"
            echo "Pinned ${REPO_FULL} default branch to template commit ${PIN_SHA}, squashed to a single commit"
          fi

          echo "repo_existed=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          REPO_FULL: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          EXISTED:   ${{ steps.create.outputs.repo_existed }}
        run: |
          {
            echo "## Infrastructure repository"
            if [[ "$EXISTED" == "true" ]]; then
              echo ""
              echo "[\`$REPO_FULL\`](https://github.com/$REPO_FULL) already existed — using existing."
            else
              echo ""
              echo "Created [\`$REPO_FULL\`](https://github.com/$REPO_FULL) from template."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Open a per-run tracking issue in the infrastructure repository.
  #     Created right after the infra repo is available (new or existing). A
  #     follow-up comment with the full infrastructure summary (plan results,
  #     verify counts) is posted by comment-infra-issue after apply + verify.
  # ────────────────────────────────────────────────────────────────────────────
  create-infra-issue:
    name: Create infra repo issue
    needs: [resolve-inputs, create-infra-repo]
    runs-on: ubuntu-latest
    outputs:
      infra_issue_number: ${{ steps.issue.outputs.number }}
      infra_issue_url:    ${{ steps.issue.outputs.url }}
    steps:
      - name: Build issue body
        id: body
        env:
          ENVIRONMENTS_JSON:  ${{ needs.resolve-inputs.outputs.environments }}
          APP_NAME:           ${{ needs.resolve-inputs.outputs.app_name }}
          AZURE_LOCATION:     ${{ needs.resolve-inputs.outputs.azure_location }}
          INFRA_REPO_FULL:    ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          INFRA_TEMPLATE:     ${{ needs.resolve-inputs.outputs.infra_template_repo }}
          INFRA_REPO_EXISTED: ${{ needs.create-infra-repo.outputs.infra_repo_existed }}
          PROVISION_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ENVS=$(jq -r '.[]' <<<"$ENVIRONMENTS_JSON")
          ENV_LIST=$(echo "$ENVS" | paste -sd, - | sed 's/,/, /g')

          if [[ "$INFRA_REPO_EXISTED" == "false" ]]; then
            TITLE_PREFIX="Provision run"
            REPO_LINE="Infrastructure repository [\`${INFRA_REPO_FULL}\`](https://github.com/${INFRA_REPO_FULL}) created from template [\`${INFRA_TEMPLATE}\`](https://github.com/${INFRA_TEMPLATE})."
          else
            TITLE_PREFIX="Reconcile run"
            REPO_LINE="Infrastructure repository [\`${INFRA_REPO_FULL}\`](https://github.com/${INFRA_REPO_FULL}) already existed — Terraform will reconcile Azure against the repo's current canonical contents."
          fi

          {
            echo "# ${TITLE_PREFIX} — \`${APP_NAME}\` / ${ENV_LIST}"
            echo
            echo "Triggered by [#${{ github.run_id }}](${PROVISION_URL})."
            echo
            echo "## Infrastructure repository"
            echo
            echo "${REPO_LINE}"
            echo
            echo "Cloud: Azure · Location: \`${AZURE_LOCATION}\`"
            echo
            echo "Environments in scope: ${ENV_LIST}"
            echo
            echo "_Infrastructure apply and verify results will be added in a follow-up comment._"
          } > /tmp/infra-issue-body.md

          echo "title=${TITLE_PREFIX} (Azure) — ${ENV_LIST}" >> "$GITHUB_OUTPUT"

      - name: Open issue
        id: issue
        env:
          GH_TOKEN:        ${{ secrets.GH_PAT }}
          INFRA_REPO_FULL: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          TITLE:           ${{ steps.body.outputs.title }}
        run: |
          URL=$(gh issue create -R "$INFRA_REPO_FULL" \
            --title "$TITLE" \
            --body-file /tmp/infra-issue-body.md)
          NUMBER="${URL##*/}"
          echo "url=$URL"        >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER"  >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Checkov – security and compliance scan, per target environment
  #    Per-env scoping lets us keep prod-strict baselines (zone redundancy, min
  #    instance count) while allowing dev/staging to run lighter footprints.
  # ────────────────────────────────────────────────────────────────────────────
  checkov:
    name: "Checkov · ${{ matrix.environment }}"
    needs: [resolve-inputs, create-infra-repo]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          path: infra-repo
          token: ${{ secrets.GH_PAT }}

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory:                 infra-repo/terraform/environments/${{ matrix.environment }}
          framework:                 terraform
          # Prod uses the strict baseline; dev/staging use the relaxed config
          config_file:               ${{ matrix.environment == 'prod' && 'infra-repo/.checkov.yaml' || 'infra-repo/.checkov.nonprod.yaml' }}
          output_format:             cli,sarif
          output_file_path:          console,checkov-results.sarif
          download_external_modules: false
          soft_fail:                 false

      - name: Upload SARIF to GitHub Security tab
        if: always()   # upload even when checkov fails so findings are visible
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file:      checkov-results.sarif
          category:        checkov-terraform-${{ matrix.environment }}

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Terraform format check (once, not per-environment)
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Terraform fmt check
    needs: [resolve-inputs, create-infra-repo]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          path: infra-repo
          token: ${{ secrets.GH_PAT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
          terraform_wrapper:  false

      - name: Check formatting
        run: terraform fmt -check -recursive infra-repo/terraform/

  # ────────────────────────────────────────────────────────────────────────────
  # 7. Bootstrap remote state storage (idempotent – safe to run every time).
  #    Delegates to the reusable bootstrap-tfstate.yml workflow so the same
  #    logic can be triggered standalone.
  # ────────────────────────────────────────────────────────────────────────────
  bootstrap-tfstate:
    name: Bootstrap tfstate storage
    needs: [resolve-inputs, checkov, fmt]
    uses: ./.github/workflows/bootstrap-tfstate.yml
    with:
      app_name:              ${{ needs.resolve-inputs.outputs.app_name }}
      azure_tenant_id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
      azure_client_id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}
      azure_location:        ${{ needs.resolve-inputs.outputs.azure_location }}

  # ────────────────────────────────────────────────────────────────────────────
  # 8. Terraform plan – one job per target environment, after scan passes
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan · ${{ matrix.environment }}"
    needs: [resolve-inputs, create-infra-repo, checkov, fmt, bootstrap-tfstate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # plan remaining envs even if one fails
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}
    environment: ${{ matrix.environment }}   # enables GitHub environment protection rules

    # The azurerm backend and provider read ARM_* env vars for OIDC auth.
    # azure/login sets AZURE_* (different prefix); we surface ARM_* here so
    # `terraform init` (backend) and `terraform plan` (provider) can both
    # authenticate without --backend-config / provider-block boilerplate.
    env:
      ARM_USE_OIDC:        "true"
      # Tell the backend to use Azure AD against the blob endpoint, not shared
      # keys. The state SA is created with --allow-shared-key-access=false, so
      # without this the backend hits 403 KeyBasedAuthenticationNotPermitted
      # even though the OIDC token itself is valid.
      ARM_USE_AZUREAD:     "true"
      ARM_TENANT_ID:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
      ARM_CLIENT_ID:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          path: infra-repo
          token: ${{ secrets.GH_PAT }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          tenant-id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          client-id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
          terraform_wrapper:  false

      - name: Generate tfvars
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          APP_NAME:               ${{ needs.resolve-inputs.outputs.app_name }}
          SUBSCRIPTION_ID:        ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          LOCATION:               ${{ needs.resolve-inputs.outputs.azure_location }}
          CONTAINER_IMAGE:        ${{ needs.resolve-inputs.outputs.container_image }}
          CONTAINER_REGISTRY_URL: ${{ needs.resolve-inputs.outputs.container_registry_url }}
        run: |
          # Write tfvars using printf to avoid shell interpolation of HCL syntax.
          printf 'app_name               = "%s"\n' "$APP_NAME"               > terraform.tfvars
          printf 'subscription_id        = "%s"\n' "$SUBSCRIPTION_ID"        >> terraform.tfvars
          printf 'location               = "%s"\n' "$LOCATION"               >> terraform.tfvars
          printf 'container_image        = "%s"\n' "$CONTAINER_IMAGE"        >> terraform.tfvars
          printf 'container_registry_url = "%s"\n' "$CONTAINER_REGISTRY_URL" >> terraform.tfvars

      - name: Terraform init
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          ENVIRONMENT:     ${{ matrix.environment }}
          STORAGE_ACCOUNT: ${{ needs.resolve-inputs.outputs.tfstate_storage_account }}
          RESOURCE_GROUP:  ${{ needs.resolve-inputs.outputs.tfstate_resource_group }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          # -no-color: markdown code blocks in the step summary don't render
          # ANSI escapes; without this the captured output is unreadable.
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan-output.txt

      - name: Write plan summary
        if: always()
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          APP_NAME:    ${{ needs.resolve-inputs.outputs.app_name }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          {
            echo "## Plan · \`$APP_NAME\` / \`$ENVIRONMENT\`"
            echo ""
            echo "<details><summary>Show plan output</summary>"
            echo ""
            echo '```'
            cat plan-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:              tfplan-azure-${{ needs.resolve-inputs.outputs.app_name }}-${{ matrix.environment }}
          retention-days:    7
          if-no-files-found: error
          path: |
            infra-repo/terraform/environments/${{ matrix.environment }}/tfplan
            infra-repo/terraform/environments/${{ matrix.environment }}/plan-output.txt

  # ────────────────────────────────────────────────────────────────────────────
  # 9. Terraform apply – consume the plan artifact and provision per environment
  # ────────────────────────────────────────────────────────────────────────────
  apply:
    name: "Apply · ${{ matrix.environment }}"
    needs: [resolve-inputs, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}
    environment: ${{ matrix.environment }}

    env:
      ARM_USE_OIDC:        "true"
      ARM_USE_AZUREAD:     "true"
      ARM_TENANT_ID:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
      ARM_CLIENT_ID:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          path: infra-repo
          token: ${{ secrets.GH_PAT }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          tenant-id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          client-id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
          terraform_wrapper:  false

      - name: Generate tfvars
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          APP_NAME:               ${{ needs.resolve-inputs.outputs.app_name }}
          SUBSCRIPTION_ID:        ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          LOCATION:               ${{ needs.resolve-inputs.outputs.azure_location }}
          CONTAINER_IMAGE:        ${{ needs.resolve-inputs.outputs.container_image }}
          CONTAINER_REGISTRY_URL: ${{ needs.resolve-inputs.outputs.container_registry_url }}
        run: |
          # Must match the plan job's tfvars exactly — a `location` that differs
          # between plan and apply would move every resource to another region.
          printf 'subscription_id        = "%s"\n' "$SUBSCRIPTION_ID"        >  terraform.tfvars
          printf 'app_name               = "%s"\n' "$APP_NAME"               >> terraform.tfvars
          printf 'location               = "%s"\n' "$LOCATION"               >> terraform.tfvars
          printf 'container_image        = "%s"\n' "$CONTAINER_IMAGE"        >> terraform.tfvars
          printf 'container_registry_url = "%s"\n' "$CONTAINER_REGISTRY_URL" >> terraform.tfvars

      - name: Terraform init
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          STORAGE_ACCOUNT: ${{ needs.resolve-inputs.outputs.tfstate_storage_account }}
          RESOURCE_GROUP:  ${{ needs.resolve-inputs.outputs.tfstate_resource_group }}
          ENVIRONMENT:     ${{ matrix.environment }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Download tfplan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-azure-${{ needs.resolve-inputs.outputs.app_name }}-${{ matrix.environment }}
          path: infra-repo/terraform/environments/${{ matrix.environment }}

      - name: Terraform apply
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          terraform apply -input=false -no-color tfplan 2>&1 | tee apply-output.txt

      - name: Write apply summary
        if: always()
        working-directory: infra-repo/terraform/environments/${{ matrix.environment }}
        env:
          APP_NAME:    ${{ needs.resolve-inputs.outputs.app_name }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          {
            echo "## Apply · \`$APP_NAME\` / \`$ENVIRONMENT\`"
            echo ""
            echo "<details><summary>Show apply output</summary>"
            echo ""
            echo '```'
            cat apply-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # 10. Verify – delegates to the reusable verify-infrastructure.yml workflow.
  #    The reusable workflow owns the GitHub Environment binding and the
  #    OIDC login, so federated credential matching stays consistent whether
  #    verify runs from here or is triggered standalone.
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: "Verify · ${{ matrix.environment }}"
    needs: [resolve-inputs, apply]
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}
    uses: ./.github/workflows/verify-infrastructure.yml
    with:
      app_name:              ${{ needs.resolve-inputs.outputs.app_name }}
      environment:           ${{ matrix.environment }}
      azure_tenant_id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
      azure_client_id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}
      # The verification logic lives in the provisioned infra repo (seeded from
      # the infra template at scripts/verify.sh), not in this orchestrator.
      infra_repo:            ${{ needs.resolve-inputs.outputs.infra_repo_full }}
    secrets:
      # Needed to check out the (possibly private) infra repo from the reusable
      # workflow — the default GITHUB_TOKEN can't read other repositories.
      gh_pat: ${{ secrets.GH_PAT }}

  # ────────────────────────────────────────────────────────────────────────────
  # 11. Application repository – create from template (idempotent).
  #
  #    The workflow can be re-invoked any number of times — typically once per
  #    environment as it is rolled out. On re-runs the repo already exists and
  #    creation is skipped, but environment configuration and federated
  #    credential registration still run (they're idempotent). The bootstrap
  #    issue, CI observation and final comment are only emitted on first
  #    creation.
  #
  #    Requires a PAT with `repo` + `workflow` + `admin:repo_hook` scopes (or a
  #    GitHub App installation token) exposed as the `GH_PAT` repository secret.
  #    The default GITHUB_TOKEN is scoped to this repo only and cannot create
  #    repositories or write to other repos' environments/variables.
  # ────────────────────────────────────────────────────────────────────────────
  create-app-repo:
    name: Create application repo
    needs: [resolve-inputs, verify]
    if: needs.resolve-inputs.outputs.with_app_repo == 'true'
    runs-on: ubuntu-latest
    outputs:
      repo_existed: ${{ steps.create.outputs.repo_existed }}
      repo_full:    ${{ needs.resolve-inputs.outputs.app_repo_full }}
      created_at:   ${{ steps.create.outputs.created_at }}
    steps:
      - name: Create from template
        id: create
        env:
          GH_TOKEN:     ${{ secrets.GH_PAT }}
          OWNER:        ${{ github.repository_owner }}
          APP_NAME:     ${{ needs.resolve-inputs.outputs.app_name }}
          REPO_FULL:    ${{ needs.resolve-inputs.outputs.app_repo_full }}
          TEMPLATE:     ${{ needs.resolve-inputs.outputs.app_template_repo }}
          TEMPLATE_REF: ${{ needs.resolve-inputs.outputs.app_template_ref }}
        run: |
          if gh api "repos/${REPO_FULL}" --silent 2>/dev/null; then
            echo "Repository ${REPO_FULL} already exists — skipping creation"
            echo "repo_existed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture the wall-clock just before the create call so we can later
          # find the auto-triggered CI run (template generation enqueues a
          # workflow run on the first commit it pushes to `main`).
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "created_at=${CREATED_AT}" >> "$GITHUB_OUTPUT"

          echo "Creating ${REPO_FULL} from template ${TEMPLATE}…"
          # Public repo: keeps the workshop's GHCR packages pullable
          # anonymously. Switch to `private=true` if your context
          # requires it — note the template's CI assumes Strategy 1
          # (public package) by default; private repos need Strategy 2
          # or 3, see the template README file.
          gh api -X POST "repos/${TEMPLATE}/generate" \
            -f "owner=${OWNER}" \
            -f "name=${APP_NAME}" \
            -f "description=Application repository for ${APP_NAME} (provisioned by platform-eng)" \
            -F "private=false" \
            -F "include_all_branches=false"

          # The "generate" endpoint is async. Wait until the repo exists AND
          # its default branch is queryable so later CI observation targets a
          # fully initialized repository.
          READY=false
          for _ in $(seq 1 30); do
            DEFAULT_BRANCH=$(gh api "repos/${REPO_FULL}" --jq '.default_branch // ""' 2>/dev/null || true)
            if [[ -n "$DEFAULT_BRANCH" ]] && gh api "repos/${REPO_FULL}/branches/${DEFAULT_BRANCH}" --silent 2>/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo "::error::Repository ${REPO_FULL} was created but its default branch did not become ready in time"
            exit 1
          fi

          # Pin the repo contents to a specific template ref if requested.
          # GitHub's generate endpoint always seeds from the template's default
          # branch; to honour a pinned tag/branch/SHA we clone the template at
          # that exact ref and force-push its content onto the new repo's
          # default branch — squashed to a single parentless commit, so the
          # repo keeps the one-commit shape the generate endpoint produces
          # instead of inheriting the template's full history.
          if [[ -n "$TEMPLATE_REF" ]]; then
            echo "Pinning ${REPO_FULL} to template ref ${TEMPLATE_REF}…"
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE}.git" \
              /tmp/template-app-pin
            git -C /tmp/template-app-pin checkout "${TEMPLATE_REF}"
            git -C /tmp/template-app-pin remote add target \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL}.git"
            # commit-tree builds the parentless commit; the resolved SHA in
            # its message records exactly which template commit the content
            # came from, even if the pinned ref was a branch or tag that
            # later moves.
            git -C /tmp/template-app-pin config user.name  "github-actions[bot]"
            git -C /tmp/template-app-pin config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PIN_SHA=$(git -C /tmp/template-app-pin rev-parse HEAD)
            PIN_COMMIT=$(git -C /tmp/template-app-pin commit-tree "HEAD^{tree}" \
              -m "Initial commit from ${TEMPLATE}@${PIN_SHA} (requested ref: ${TEMPLATE_REF})")
            git -C /tmp/template-app-pin push --force target \
              "${PIN_COMMIT}:refs/heads/${DEFAULT_BRANCH}"
            echo "Pinned ${REPO_FULL} default branch to template commit ${PIN_SHA}, squashed to a single commit"
          fi

          echo "repo_existed=false" >> "$GITHUB_OUTPUT"

      # Grant the default GITHUB_TOKEN write permission to GHCR (and other
      # in-repo writes) so the template's CI workflow can `docker push` to
      # ghcr.io/<owner>/<repo> using the workflow token. New repos default to
      # `read` only, which causes `denied: permission_denied: write_package`.
      # Idempotent (PUT) — safe to run on every invocation.
      - name: Allow workflows to write packages
        env:
          GH_TOKEN:  ${{ secrets.GH_PAT }}
          REPO_FULL: ${{ needs.resolve-inputs.outputs.app_repo_full }}
        run: |
          gh api --method PUT "repos/${REPO_FULL}/actions/permissions/workflow" \
            -f default_workflow_permissions=write \
            -F can_approve_pull_request_reviews=false \
            --silent
          echo "Default workflow permissions on ${REPO_FULL} set to 'write'"

      - name: Summary
        env:
          REPO_FULL: ${{ needs.resolve-inputs.outputs.app_repo_full }}
          EXISTED:   ${{ steps.create.outputs.repo_existed }}
        run: |
          {
            echo "## Application repository"
            if [[ "$EXISTED" == "true" ]]; then
              echo ""
              echo "[\`$REPO_FULL\`](https://github.com/$REPO_FULL) already existed — environment configuration will be reconciled, CI observation skipped."
            else
              echo ""
              echo "Created [\`$REPO_FULL\`](https://github.com/$REPO_FULL) from template."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # 12. Per-run tracking issue in the application repository. Covers only
  #     app-specific outcomes: whether the repo was created or already existed,
  #     and (via a follow-up comment from finalize) env config and CI/CD results.
  #     Infrastructure details are tracked separately in the infra repo issue.
  # ────────────────────────────────────────────────────────────────────────────
  create-run-issue:
    name: Create app repo issue
    needs: [resolve-inputs, create-app-repo]
    if: needs.resolve-inputs.outputs.with_app_repo == 'true'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
      issue_url:    ${{ steps.issue.outputs.url }}
    steps:
      - name: Build issue body
        id: body
        env:
          ENVIRONMENTS_JSON: ${{ needs.resolve-inputs.outputs.environments }}
          APP_NAME:          ${{ needs.resolve-inputs.outputs.app_name }}
          LOCATION:          ${{ needs.resolve-inputs.outputs.azure_location }}
          APP_TEMPLATE:      ${{ needs.resolve-inputs.outputs.app_template_repo }}
          APP_REPO_FULL:     ${{ needs.create-app-repo.outputs.repo_full }}
          REPO_EXISTED:      ${{ needs.create-app-repo.outputs.repo_existed }}
          PROVISION_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ENVS=$(jq -r '.[]' <<<"$ENVIRONMENTS_JSON")
          ENV_LIST=$(echo "$ENVS" | paste -sd, - | sed 's/,/, /g')

          if [[ "$REPO_EXISTED" == "false" ]]; then
            TITLE_PREFIX="Bootstrap run"
            APP_REPO_LINE="Application repository [\`${APP_REPO_FULL}\`](https://github.com/${APP_REPO_FULL}) created from template [\`${APP_TEMPLATE}\`](https://github.com/${APP_TEMPLATE})."
          else
            TITLE_PREFIX="Reconcile run"
            APP_REPO_LINE="Application repository [\`${APP_REPO_FULL}\`](https://github.com/${APP_REPO_FULL}) already exists — environment configuration will be reconciled."
          fi

          {
            echo "# ${TITLE_PREFIX} — \`${APP_NAME}\` / ${ENV_LIST}"
            echo
            echo "Triggered by [#${{ github.run_id }}](${PROVISION_URL})."
            echo
            echo "## Application repository"
            echo
            echo "${APP_REPO_LINE}"
            echo
            echo "Cloud: Azure · Location: \`${LOCATION}\`"
            echo
            echo "Environments in scope: ${ENV_LIST}"
            echo
            echo "_Environment settings, CI/CD details, and a run summary will be added in a follow-up comment._"
          } > /tmp/app-issue-body.md

          echo "title=${TITLE_PREFIX} (Azure) — ${ENV_LIST}" >> "$GITHUB_OUTPUT"

      - name: Open issue
        id: issue
        env:
          GH_TOKEN:  ${{ secrets.GH_PAT }}
          REPO_FULL: ${{ needs.create-app-repo.outputs.repo_full }}
          TITLE:     ${{ steps.body.outputs.title }}
        run: |
          URL=$(gh issue create -R "$REPO_FULL" \
            --title "$TITLE" \
            --body-file /tmp/app-issue-body.md)
          NUMBER="${URL##*/}"
          echo "url=$URL"        >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER"  >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # 13. Comment on the infra repo issue with the full infrastructure summary:
  #      per-env terraform plan results, verification test counts, and whether
  #      this run was a provision or reconcile. Runs after apply + verify.
  # ────────────────────────────────────────────────────────────────────────────
  comment-infra-issue:
    name: Comment on infra issue
    needs: [resolve-inputs, create-infra-repo, create-infra-issue, apply, verify]
    runs-on: ubuntu-latest
    steps:
      # One download step per env — same artifact naming pattern as plan/verify.
      - name: Download plan artifact (dev)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'dev')
        uses: actions/download-artifact@v8
        with:
          name: tfplan-azure-${{ needs.resolve-inputs.outputs.app_name }}-dev
          path: plans/dev

      - name: Download plan artifact (staging)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'staging')
        uses: actions/download-artifact@v8
        with:
          name: tfplan-azure-${{ needs.resolve-inputs.outputs.app_name }}-staging
          path: plans/staging

      - name: Download plan artifact (prod)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'prod')
        uses: actions/download-artifact@v8
        with:
          name: tfplan-azure-${{ needs.resolve-inputs.outputs.app_name }}-prod
          path: plans/prod

      - name: Download verify summary (dev)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'dev')
        uses: actions/download-artifact@v8
        with:
          name: verify-azure-dev
          path: verify/dev

      - name: Download verify summary (staging)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'staging')
        uses: actions/download-artifact@v8
        with:
          name: verify-azure-staging
          path: verify/staging

      - name: Download verify summary (prod)
        if: contains(fromJson(needs.resolve-inputs.outputs.environments), 'prod')
        uses: actions/download-artifact@v8
        with:
          name: verify-azure-prod
          path: verify/prod

      - name: Inspect downloaded artifacts
        run: |
          echo "::group::plans/ tree"
          find plans -maxdepth 3 -print | head -50
          echo "::endgroup::"
          echo "::group::verify/ tree"
          find verify -maxdepth 3 -print | head -50
          echo "::endgroup::"

      - name: Build and post infra issue comment
        env:
          GH_TOKEN:           ${{ secrets.GH_PAT }}
          ENVIRONMENTS_JSON:  ${{ needs.resolve-inputs.outputs.environments }}
          INFRA_REPO_FULL:    ${{ needs.resolve-inputs.outputs.infra_repo_full }}
          INFRA_REPO_EXISTED: ${{ needs.create-infra-repo.outputs.infra_repo_existed }}
          INFRA_ISSUE_NUMBER: ${{ needs.create-infra-issue.outputs.infra_issue_number }}
          LOCATION:           ${{ needs.resolve-inputs.outputs.azure_location }}
          PROVISION_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ENVS=$(jq -r '.[]' <<<"$ENVIRONMENTS_JSON")

          STATUSES=""
          TOTAL_ADD=0; TOTAL_CHANGE=0; TOTAL_DESTROY=0
          TOTAL_PASS=0; TOTAL_FAIL=0
          for env in $ENVS; do
            PLAN_FILE="plans/${env}/plan-output.txt"
            if [[ ! -f "$PLAN_FILE" ]]; then
              STATUSES+="- \`${env}\` — plan output not available"$'\n'
            elif grep -qE "^No changes\." "$PLAN_FILE"; then
              STATUSES+="- \`${env}\` — **no changes** (already up-to-date)"$'\n'
            else
              PLAN_LINE=$(grep -E "^Plan: " "$PLAN_FILE" | tail -1 || true)
              ADD=$(   grep -oE "[0-9]+ to add"     <<<"$PLAN_LINE" | grep -oE "^[0-9]+" || echo 0)
              CHANGE=$(grep -oE "[0-9]+ to change"  <<<"$PLAN_LINE" | grep -oE "^[0-9]+" || echo 0)
              DESTROY=$(grep -oE "[0-9]+ to destroy" <<<"$PLAN_LINE" | grep -oE "^[0-9]+" || echo 0)
              TOTAL_ADD=$((TOTAL_ADD + ADD))
              TOTAL_CHANGE=$((TOTAL_CHANGE + CHANGE))
              TOTAL_DESTROY=$((TOTAL_DESTROY + DESTROY))
              if   [[ "$ADD" -gt 0 && "$CHANGE" -eq 0 && "$DESTROY" -eq 0 ]]; then
                STATUSES+="- \`${env}\` — **created** (${ADD} resources added)"$'\n'
              elif [[ "$ADD" -eq 0 && "$CHANGE" -gt 0 && "$DESTROY" -eq 0 ]]; then
                STATUSES+="- \`${env}\` — **refreshed** (${CHANGE} resources updated)"$'\n'
              elif [[ "$ADD" -eq 0 && "$CHANGE" -eq 0 && "$DESTROY" -eq 0 ]]; then
                STATUSES+="- \`${env}\` — **no changes**"$'\n'
              else
                STATUSES+="- \`${env}\` — applied (${ADD} added, ${CHANGE} changed, ${DESTROY} destroyed)"$'\n'
              fi
            fi

            VERIFY_FILE="verify/${env}/verify-summary.txt"
            if [[ -f "$VERIFY_FILE" ]]; then
              ENV_PASS=$(grep -oE '^passed=[0-9]+' "$VERIFY_FILE" | cut -d= -f2 || echo 0)
              ENV_FAIL=$(grep -oE '^failed=[0-9]+' "$VERIFY_FILE" | cut -d= -f2 || echo 0)
              TOTAL_PASS=$((TOTAL_PASS + ENV_PASS))
              TOTAL_FAIL=$((TOTAL_FAIL + ENV_FAIL))
            fi
          done

          if [[ "$INFRA_REPO_EXISTED" == "false" ]]; then
            HEADING="Provision run summary"
            CLOSING="Infrastructure provisioned and verified. The infra repo is the canonical source of truth — any changes committed there will be applied on the next provision run."
          else
            HEADING="Reconcile run summary"
            CLOSING="Infrastructure reconciled against the current canonical contents of the infra repo. Resources were adjusted as needed; the deployed application image is preserved across reconcile runs."
          fi

          {
            echo "## ${HEADING}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Provisioning | [#${{ github.run_id }}]($PROVISION_URL) |"
            echo "| Cloud / region | Azure / \`${LOCATION}\` |"
            echo "| Resources changed | + ${TOTAL_ADD} · ~ ${TOTAL_CHANGE} · - ${TOTAL_DESTROY} |"
            echo "| Verification tests | passed ${TOTAL_PASS} · failed ${TOTAL_FAIL} |"
            echo
            echo "## Environment status"
            echo
            printf '%s' "${STATUSES}"
            echo
            echo "${CLOSING}"
          } > /tmp/infra-comment.md

          # Comment on the per-run issue in the infra repo
          if [[ -n "$INFRA_ISSUE_NUMBER" ]]; then
            gh issue comment "$INFRA_ISSUE_NUMBER" -R "$INFRA_REPO_FULL" --body-file /tmp/infra-comment.md
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 14. Configure GitHub Environments and variables — one job per environment.
  #     Always runs (idempotent: PUT for the env, PATCH→POST for each variable)
  #     so re-invocations can roll out additional envs to an existing app repo.
  # ────────────────────────────────────────────────────────────────────────────
  configure-environments:
    name: "Configure env · ${{ matrix.environment }}"
    needs: [resolve-inputs, create-app-repo]
    if: needs.resolve-inputs.outputs.with_app_repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}
    steps:
      - name: Create environment and set variables
        env:
          GH_TOKEN:  ${{ secrets.GH_PAT }}
          REPO_FULL: ${{ needs.create-app-repo.outputs.repo_full }}
          ENV:       ${{ matrix.environment }}
          APP_NAME:  ${{ needs.resolve-inputs.outputs.app_name }}
          TID:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
          SUB:       ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          CID:       ${{ needs.resolve-inputs.outputs.azure_client_id }}
          REGISTRY:  ${{ needs.resolve-inputs.outputs.container_registry_url }}
        run: |
          # 1. Create the environment (PUT is idempotent — 200 if it already exists).
          gh api -X PUT "repos/${REPO_FULL}/environments/${ENV}" --silent

          # 2. Set per-environment variables. Try update first, fall back to create.
          set_var() {
            local name="$1" value="$2"
            if ! gh api -X PATCH "repos/${REPO_FULL}/environments/${ENV}/variables/${name}" \
                   -f "name=${name}" -f "value=${value}" --silent 2>/dev/null; then
              gh api -X POST "repos/${REPO_FULL}/environments/${ENV}/variables" \
                -f "name=${name}" -f "value=${value}" --silent
            fi
          }

          set_var AZURE_TENANT_ID       "$TID"
          set_var AZURE_SUBSCRIPTION_ID "$SUB"
          set_var AZURE_CLIENT_ID       "$CID"
          set_var AZURE_RESOURCE_GROUP  "rg-${APP_NAME}-${ENV}"
          set_var AZURE_WEBAPP_NAME     "app-${APP_NAME}-${ENV}"

          # The app repo's deploy router (deploy.yml) picks its cloud-specific
          # reusable workflow from this environment-scoped variable, so each
          # environment can live on a different cloud. This run provisions
          # Azure for exactly the environments in its matrix, so it stamps
          # those — and only those — as azure. A reconcile run by another
          # cloud's workflow re-stamps the environments it owns.
          set_var DEPLOY_TARGET_CLOUD   "azure"

          echo "Environment '${ENV}' configured on ${REPO_FULL}"

  # ────────────────────────────────────────────────────────────────────────────
  # 15. Register federated credentials on the platform-eng App Registration so
  #      OIDC tokens issued for the new app repo are accepted by Entra ID.
  #      Without these, deploy.yml in the new repo fails on `azure/login` with
  #      AADSTS700213 ("No matching federated identity record found").
  #      Always runs (idempotent: skips if the subject already has a
  #      credential) so re-invocations can register additional environments.
  #
  #      The subject prefix is queried from GitHub rather than assembled from
  #      the repo name: repos created after 2026-07-15 present immutable-ID
  #      subjects (repo:owner@123/name@456:...), older repos the legacy
  #      repo:owner/name form, and Entra matches subjects verbatim.
  #
  #      Prerequisite: the SP itself must be an Owner of its own App
  #      Registration AND hold Application.ReadWrite.OwnedBy on Microsoft
  #      Graph (admin consent) to manage its own federated credentials.
  #      See docs/setup-azure.md step 5.
  # ────────────────────────────────────────────────────────────────────────────
  configure-federated-credentials:
    name: "Federated credential · ${{ matrix.environment }}"
    needs: [resolve-inputs, create-app-repo]
    if: needs.resolve-inputs.outputs.with_app_repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-inputs.outputs.environments) }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          tenant-id:       ${{ needs.resolve-inputs.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.resolve-inputs.outputs.azure_subscription_id }}
          client-id:       ${{ needs.resolve-inputs.outputs.azure_client_id }}

      - name: Register federated credential
        env:
          GH_TOKEN:  ${{ secrets.GH_PAT }}
          APP_ID:    ${{ needs.resolve-inputs.outputs.azure_client_id }}
          REPO_FULL: ${{ needs.create-app-repo.outputs.repo_full }}
          ENV:       ${{ matrix.environment }}
        run: |
          # GitHub decides the token's subject format per repository: repos
          # created (or renamed/transferred) after 2026-07-15 embed immutable
          # IDs (repo:owner@123/name@456:...), while older repos keep the
          # plain repo:owner/name form. Ask GitHub for the repo's actual
          # prefix instead of assuming either form — registering the wrong
          # one only fails later, at azure/login in the app repo's deploy,
          # with AADSTS700213.
          PREFIX=$(gh api "repos/${REPO_FULL}/actions/oidc/customization/sub" \
                     --jq '.sub_claim_prefix // empty' 2>/dev/null || true)
          if [[ -z "$PREFIX" ]]; then
            echo "::error::Could not read the OIDC subject prefix of ${REPO_FULL} (GET repos/${REPO_FULL}/actions/oidc/customization/sub returned nothing). Registering a guessed subject would break the app repo's deploy, so failing here instead. Check that GH_PAT can read the repo's Actions OIDC settings."
            exit 1
          fi
          SUBJECT="${PREFIX}:environment:${ENV}"

          # Idempotent: skip if a credential with this exact subject already exists.
          EXISTING=$(az ad app federated-credential list --id "$APP_ID" \
            --query "[?subject=='${SUBJECT}'].id | [0]" -o tsv 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "Federated credential for '${SUBJECT}' already exists — skipping"
            exit 0
          fi

          # Name: alphanumeric + hyphens, ≤120 chars. owner-app-env is unique.
          NAME="${REPO_FULL//\//-}-${ENV}"

          # The name slot may already hold a credential with a DIFFERENT
          # subject. App names are never reused (they are unique in the
          # CMDB), so in practice this means the repo was deleted and
          # recreated while troubleshooting an initial provisioning — GitHub
          # mints a new immutable repo ID on recreation, so the stored
          # subject can never be presented again. This workflow deliberately
          # does not repoint or delete an existing identity credential;
          # that is an operator's decision. Fail with everything the team
          # needs to make it.
          STALE_SUBJECT=$(az ad app federated-credential list --id "$APP_ID" \
            --query "[?name=='${NAME}'].subject | [0]" -o tsv 2>/dev/null || true)
          if [[ -n "$STALE_SUBJECT" ]]; then
            {
              echo "## Federated credential conflict — \`${ENV}\`"
              echo ""
              echo "The App Registration already has a federated credential named \`${NAME}\`,"
              echo "but it holds a different subject than the one ${REPO_FULL} now presents:"
              echo ""
              echo "| | Subject |"
              echo "|---|---|"
              echo "| Registered (stale) | \`${STALE_SUBJECT}\` |"
              echo "| Required by the repo | \`${SUBJECT}\` |"
              echo ""
              echo "This typically means the app repo was deleted and recreated (e.g. while"
              echo "troubleshooting an initial provisioning): GitHub embeds an immutable repo ID"
              echo "in OIDC subjects, so the recreated repo presents a new subject and the stale"
              echo "registration can never match a token again."
              echo ""
              echo "This workflow does not modify or remove existing identity credentials — decide"
              echo "how to proceed. Typically, remove the stale registration and re-run:"
              echo ""
              echo '```bash'
              echo "az ad app federated-credential delete --id <azure_client_id> --federated-credential-id ${NAME}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Federated credential '${NAME}' already exists with a stale subject '${STALE_SUBJECT}' (the repo now presents '${SUBJECT}' — it was likely deleted and recreated). This workflow never repoints existing credentials. See the job summary for details; typically: remove the stale registration (az ad app federated-credential delete --id <azure_client_id> --federated-credential-id ${NAME}) and re-run."
            exit 1
          fi

          az ad app federated-credential create --id "$APP_ID" --parameters @<(cat <<JSON
          {
            "name":      "${NAME}",
            "issuer":    "https://token.actions.githubusercontent.com",
            "subject":   "${SUBJECT}",
            "audiences": ["api://AzureADTokenExchange"]
          }
          JSON
          )
          echo "Registered federated credential '${NAME}' for subject '${SUBJECT}'"

  # ────────────────────────────────────────────────────────────────────────────
  # 16. Observe the CI run that template-generation auto-triggered.
  #
  #     When a repo is created from a template, GitHub pushes the initial
  #     commit to `main` and any `on: push` workflows fire automatically. So
  #     we don't dispatch CI ourselves — we just find that auto-run, watch it
  #     to completion, and propagate its conclusion as this job's status.
  #
  #     Contract with the template repo: ci.yml runs build/test AND calls the
  #     dev-deploy job as a reusable workflow inside the same run. A single
  #     `success` conclusion means "build + test + dev deploy all passed".
  #
  #     Skipped on re-runs: the auto-trigger only happens at creation time.
  # ────────────────────────────────────────────────────────────────────────────
  observe-ci:
    name: Observe CI in app repo
    needs: [resolve-inputs, create-app-repo, configure-environments, configure-federated-credentials]
    if: needs.resolve-inputs.outputs.with_app_repo == 'true' && needs.create-app-repo.outputs.repo_existed == 'false'
    runs-on: ubuntu-latest
    outputs:
      ci_run_id:     ${{ steps.ci.outputs.ci_run_id }}
      ci_run_url:    ${{ steps.ci.outputs.ci_run_url }}
      ci_conclusion: ${{ steps.ci.outputs.ci_conclusion }}
    steps:
      - name: Checkout (for helper script)
        uses: actions/checkout@v6

      - name: Watch CI run (build + test + dev deploy)
        id: ci
        env:
          GH_TOKEN:      ${{ secrets.GH_PAT }}
          REPO_FULL:     ${{ needs.create-app-repo.outputs.repo_full }}
          WORKFLOW_FILE: ${{ needs.resolve-inputs.outputs.ci_workflow_file }}
          SINCE:         ${{ needs.create-app-repo.outputs.created_at }}
        run: |
          bash scripts/watch-run.sh \
            --repo        "$REPO_FULL" \
            --workflow    "$WORKFLOW_FILE" \
            --since       "$SINCE" \
            --output-key  ci \
            --timeout-min 20

      # watch-run.sh always exits 0 (it reports the conclusion via outputs).
      # Translate a non-success conclusion into a job failure here so the
      # platform run reflects reality.
      - name: Fail on non-success conclusion
        env:
          CI_RUN_ID:     ${{ steps.ci.outputs.ci_run_id }}
          CI_RUN_URL:    ${{ steps.ci.outputs.ci_run_url }}
          CI_CONCLUSION: ${{ steps.ci.outputs.ci_conclusion }}
        run: |
          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "::error::CI run #${CI_RUN_ID:-(unknown)} concluded as '${CI_CONCLUSION:-(unknown)}' — see ${CI_RUN_URL:-(no URL)} for details on the root cause"
            exit 1
          fi
          echo "CI run #${CI_RUN_ID} succeeded: ${CI_RUN_URL}"

  # ────────────────────────────────────────────────────────────────────────────
  # 17. Comment on the app repo issue with the app-specific run summary:
  #     env config result, federated credentials, CI/CD run. Waits for
  #     configure-environments and configure-federated-credentials so their
  #     results are available even on reconcile runs (where observe-ci is
  #     skipped and would not transitively hold for those jobs).
  # ────────────────────────────────────────────────────────────────────────────
  comment-app-issue:
    name: Comment on app issue
    needs: [resolve-inputs, create-app-repo, create-run-issue, configure-environments, configure-federated-credentials, observe-ci]
    # Always runs regardless of whether observe-ci was skipped (reconcile runs).
    if: always() && needs.resolve-inputs.outputs.with_app_repo == 'true' && needs.create-run-issue.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Build and post app issue comment
        env:
          GH_TOKEN:      ${{ secrets.GH_PAT }}
          REPO_FULL:     ${{ needs.create-app-repo.outputs.repo_full }}
          REPO_EXISTED:  ${{ needs.create-app-repo.outputs.repo_existed }}
          ISSUE_NUMBER:  ${{ needs.create-run-issue.outputs.issue_number }}
          PROVISION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_ID:     ${{ needs.observe-ci.outputs.ci_run_id }}
          CI_RUN_URL:    ${{ needs.observe-ci.outputs.ci_run_url }}
          CI_CONCLUSION: ${{ needs.observe-ci.outputs.ci_conclusion }}
          ENV_RESULT:    ${{ needs.configure-environments.result }}
          CRED_RESULT:   ${{ needs.configure-federated-credentials.result }}
        run: |
          fmt() {
            local url="$1" status="$2"
            if [[ -n "$url" ]]; then
              echo "[\`$status\`]($url)"
            else
              echo "\`${status:-not run}\`"
            fi
          }

          PROV_ROW="| Provisioning | [#${{ github.run_id }}]($PROVISION_URL) |"
          ENV_ROW="| Environment settings/secrets | \`${ENV_RESULT:-unknown}\` |"
          CRED_ROW="| Federated credentials | \`${CRED_RESULT:-unknown}\` |"

          if [[ "$REPO_EXISTED" == "false" ]]; then
            HEADING="Bootstrap run summary"
            CI_ROW="| CI + dev deploy (app repo) | $(fmt "$CI_RUN_URL" "${CI_CONCLUSION:-skipped}")${CI_RUN_ID:+ (run #${CI_RUN_ID})} |"
            ROWS=$(printf '%s\n%s\n%s\n%s' "$PROV_ROW" "$ENV_ROW" "$CRED_ROW" "$CI_ROW")
            if [[ "$CI_CONCLUSION" == "success" ]]; then
              CLOSING="The application repository is now ready for development. Merge the template README updates and start iterating — every push to \`main\` will run CI and (on success) deploy to dev."
            else
              CI_LINK="${CI_RUN_URL:-the CI run}"
              CLOSING="⚠️ The CI run did not succeed (conclusion: \`${CI_CONCLUSION:-unknown}\`). Investigate ${CI_LINK} and fix the failures before iterating on the application — pushes to \`main\` will keep failing until the issue is resolved. Re-run CI from the app repo's Actions tab once fixed; this platform run does not need to be re-invoked."
            fi
          else
            HEADING="Reconcile run summary"
            ROWS=$(printf '%s\n%s\n%s' "$PROV_ROW" "$ENV_ROW" "$CRED_ROW")
            CLOSING="Requested environment(s) reconciled. Environment settings and federated credentials have been updated. If you need a fresh deploy, run the CI workflow from the app repo's Actions tab."
          fi

          {
            echo "## ${HEADING}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            printf '%s\n' "${ROWS}"
            echo
            echo "${CLOSING}"
          } > /tmp/app-comment.md

          # Comment on the per-run issue in the app repo
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" -R "$REPO_FULL" --body-file /tmp/app-comment.md
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 18. Write the consolidated platform-side step summary once both issue
  #     comments have been posted. Links out to the per-repo issues where the
  #     full run details live.
  # ────────────────────────────────────────────────────────────────────────────
  final-summary:
    name: Final summary
    needs: [create-run-issue, create-infra-issue, comment-app-issue, comment-infra-issue]
    if: always() && needs.comment-infra-issue.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Write step summary
        env:
          PROVISION_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_ISSUE_URL:   ${{ needs.create-run-issue.outputs.issue_url }}
          INFRA_ISSUE_URL: ${{ needs.create-infra-issue.outputs.infra_issue_url }}
        run: |
          {
            echo "## Provision Infrastructure (Azure) — run complete"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Provisioning run | [#${{ github.run_id }}]($PROVISION_URL) |"
            if [[ -n "$APP_ISSUE_URL" ]];   then echo "| App repo issue   | $APP_ISSUE_URL |";   fi
            if [[ -n "$INFRA_ISSUE_URL" ]]; then echo "| Infra repo issue | $INFRA_ISSUE_URL |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
