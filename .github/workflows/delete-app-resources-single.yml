name: Azure - Delete Application Resources (Single Environment)

on:
  workflow_call:
    inputs:
      app_name:
        description: Application name
        type: string
        required: true
      environment:
        description: Target environment (dev, staging, prod)
        type: string
        required: true
      azure_tenant_id:
        description: Azure Tenant ID
        type: string
        required: true
      azure_subscription_id:
        description: Azure Subscription ID
        type: string
        required: true
      azure_client_id:
        description: Client ID of the Azure service principal / managed identity used for OIDC login
        type: string
        required: true
      confirmation_app_name:
        description: Repeat the exact application name to confirm destructive deletion
        type: string
        required: true
      confirmation_environment:
        description: Repeat the exact environment to confirm destructive deletion
        type: string
        required: true
      wait_for_completion:
        description: Wait until Azure confirms the resource group is fully deleted
        type: string
        required: false
        default: "true"
    secrets:
      GH_PAT:
        required: true

  workflow_dispatch:
    inputs:
      app_name:
        description: Application name
        type: string
        required: true
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      azure_tenant_id:
        description: "Azure Tenant ID (optional — falls back to the PROVISION_AZURE_TENANT_ID repository variable)"
        type: string
        required: false
      azure_subscription_id:
        description: "Azure Subscription ID (optional — falls back to the PROVISION_AZURE_SUBSCRIPTION_ID repository variable)"
        type: string
        required: false
      azure_client_id:
        description: "Client ID of the Azure service principal / managed identity used for OIDC login (optional — falls back to the PROVISION_AZURE_CLIENT_ID repository variable)"
        type: string
        required: false
      confirmation_app_name:
        description: Repeat the exact application name to confirm destructive deletion
        type: string
        required: true
      confirmation_environment:
        description: Repeat the exact environment to confirm destructive deletion
        type: string
        required: true
      wait_for_completion:
        description: Wait until Azure confirms the resource group is fully deleted
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.out.outputs.app_name }}
      environment: ${{ steps.out.outputs.environment }}
      wait_for_completion: ${{ steps.out.outputs.wait_for_completion }}
      resource_group_name: ${{ steps.out.outputs.resource_group_name }}
      app_repo_full: ${{ steps.out.outputs.app_repo_full }}
      azure_tenant_id: ${{ steps.out.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ steps.out.outputs.azure_subscription_id }}
      azure_client_id: ${{ steps.out.outputs.azure_client_id }}
    steps:
      - name: Validate
        id: out
        env:
          IN_APP:         ${{ inputs.app_name }}
          WD_APP:         ${{ github.event.inputs.app_name }}
          IN_ENV:         ${{ inputs.environment }}
          WD_ENV:         ${{ github.event.inputs.environment }}
          IN_CONFIRM_APP: ${{ inputs.confirmation_app_name }}
          WD_CONFIRM_APP: ${{ github.event.inputs.confirmation_app_name }}
          IN_CONFIRM_ENV: ${{ inputs.confirmation_environment }}
          WD_CONFIRM_ENV: ${{ github.event.inputs.confirmation_environment }}
          IN_WAIT:        ${{ inputs.wait_for_completion }}
          WD_WAIT:        ${{ github.event.inputs.wait_for_completion }}
          IN_TENANT_ID:   ${{ inputs.azure_tenant_id }}
          WD_TENANT_ID:   ${{ github.event.inputs.azure_tenant_id }}
          IN_SUB_ID:      ${{ inputs.azure_subscription_id }}
          WD_SUB_ID:      ${{ github.event.inputs.azure_subscription_id }}
          IN_CLIENT_ID:   ${{ inputs.azure_client_id }}
          WD_CLIENT_ID:   ${{ github.event.inputs.azure_client_id }}
          VAR_TENANT_ID:  ${{ vars.PROVISION_AZURE_TENANT_ID }}
          VAR_SUB_ID:     ${{ vars.PROVISION_AZURE_SUBSCRIPTION_ID }}
          VAR_CLIENT_ID:  ${{ vars.PROVISION_AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail

          APP_NAME="${IN_APP:-$WD_APP}"
          ENVIRONMENT="${IN_ENV:-$WD_ENV}"
          CONFIRM_APP_NAME="${IN_CONFIRM_APP:-$WD_CONFIRM_APP}"
          CONFIRM_ENVIRONMENT="${IN_CONFIRM_ENV:-$WD_CONFIRM_ENV}"
          WAIT_FOR_COMPLETION="${IN_WAIT:-${WD_WAIT:-true}}"

          # Target-cloud parameters: an explicit input always wins; the
          # PROVISION_* repository variable is the organization fallback. It
          # only engages on the external interface (workflow_dispatch /
          # repository_dispatch): workflow_call inputs stay required, so
          # workflow-to-workflow calls always pass explicit values.
          AZURE_TENANT_ID="${IN_TENANT_ID:-${WD_TENANT_ID:-$VAR_TENANT_ID}}"
          AZURE_SUBSCRIPTION_ID="${IN_SUB_ID:-${WD_SUB_ID:-$VAR_SUB_ID}}"
          AZURE_CLIENT_ID="${IN_CLIENT_ID:-${WD_CLIENT_ID:-$VAR_CLIENT_ID}}"

          MISSING_CLOUD=()
          [[ -z "$AZURE_TENANT_ID" ]] && MISSING_CLOUD+=("azure_tenant_id|PROVISION_AZURE_TENANT_ID")
          [[ -z "$AZURE_SUBSCRIPTION_ID" ]] && MISSING_CLOUD+=("azure_subscription_id|PROVISION_AZURE_SUBSCRIPTION_ID")
          [[ -z "$AZURE_CLIENT_ID" ]] && MISSING_CLOUD+=("azure_client_id|PROVISION_AZURE_CLIENT_ID")
          if [[ ${#MISSING_CLOUD[@]} -gt 0 ]]; then
            for M in "${MISSING_CLOUD[@]}"; do
              IFS='|' read -r IN VAR <<<"$M"
              echo "::error::Target-cloud parameter '${IN}' is missing — pass it as an input on this run, or set the repository variable ${VAR} once as the organization default."
            done
            {
            echo "## Missing target-cloud parameters"
            echo ""
            echo "The target cloud is usually locked in for the organization: set each"
            echo "repository variable once, or pass the input to override it per run."
            echo "An input always overrides the variable."
            echo ""
            echo "| Parameter | Pass per run as | …or set once as repository variable |"
            echo "|-----------|-----------------|--------------------------------------|"
            for M in "${MISSING_CLOUD[@]}"; do
              IFS='|' read -r IN VAR <<<"$M"
              echo "| \`${IN}\` | workflow input | \`gh variable set ${VAR}\` |"
            done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          [[ -z "$APP_NAME" ]] && { echo "::error::app_name is required"; exit 1; }
          [[ -z "$ENVIRONMENT" ]] && { echo "::error::environment is required"; exit 1; }

          if [[ "$APP_NAME" != "$CONFIRM_APP_NAME" ]]; then
            echo "::error::confirmation_app_name must exactly match app_name"
            exit 1
          fi
          if [[ "$ENVIRONMENT" != "$CONFIRM_ENVIRONMENT" ]]; then
            echo "::error::confirmation_environment must exactly match environment"
            exit 1
          fi
          if ! [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$ ]]; then
            echo "::error::app_name must be 3-22 chars, lowercase alphanumeric and hyphens, no leading/trailing hyphen"
            exit 1
          fi
          if [[ "$ENVIRONMENT" != "dev" && "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "prod" ]]; then
            echo "::error::environment must be one of dev, staging, prod"
            exit 1
          fi
          if [[ "$WAIT_FOR_COMPLETION" != "true" && "$WAIT_FOR_COMPLETION" != "false" ]]; then
            echo "::error::wait_for_completion must be either true or false"
            exit 1
          fi

          RG_NAME="rg-${APP_NAME}-${ENVIRONMENT}"
          APP_REPO_FULL="${GITHUB_REPOSITORY_OWNER}/${APP_NAME}"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "wait_for_completion=$WAIT_FOR_COMPLETION" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "app_repo_full=$APP_REPO_FULL" >> "$GITHUB_OUTPUT"
          echo "azure_tenant_id=$AZURE_TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "azure_subscription_id=$AZURE_SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "azure_client_id=$AZURE_CLIENT_ID" >> "$GITHUB_OUTPUT"

  delete-rg:
    name: Delete Azure resource group
    needs: validate
    uses: ./.github/workflows/delete-resource-group.yml
    with:
      resource_group_name:   ${{ needs.validate.outputs.resource_group_name }}
      azure_tenant_id:       ${{ needs.validate.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ needs.validate.outputs.azure_subscription_id }}
      azure_client_id:       ${{ needs.validate.outputs.azure_client_id }}
      wait_for_completion:   ${{ needs.validate.outputs.wait_for_completion }}

  cleanup-github-and-oidc:
    name: Cleanup GitHub environment and OIDC
    needs: [validate, delete-rg]
    runs-on: ubuntu-latest
    steps:
      - name: Remove GitHub environment variables and environment
        env:
          GH_TOKEN:        ${{ secrets.GH_PAT }}
          APP_REPO_FULL:   ${{ needs.validate.outputs.app_repo_full }}
          TARGET_ENV:      ${{ needs.validate.outputs.environment }}
        run: |
          set -euo pipefail

          if ! gh api "repos/${APP_REPO_FULL}" --silent 2>/dev/null; then
            echo "Application repo '${APP_REPO_FULL}' not found. Skipping GitHub environment cleanup."
            echo "github_environment_status=Repo not found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VAR_NAMES=$(gh api "repos/${APP_REPO_FULL}/environments/${TARGET_ENV}/variables" --jq '.variables[].name' 2>/dev/null || true)
          if [[ -n "$VAR_NAMES" ]]; then
            while IFS= read -r var_name; do
              [[ -z "$var_name" ]] && continue
              gh api -X DELETE "repos/${APP_REPO_FULL}/environments/${TARGET_ENV}/variables/${var_name}" --silent || true
            done <<< "$VAR_NAMES"
          fi

          gh api -X DELETE "repos/${APP_REPO_FULL}/environments/${TARGET_ENV}" --silent 2>/dev/null || true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          tenant-id:       ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}
          client-id:       ${{ needs.validate.outputs.azure_client_id }}

      # Deleting the resource group removes the resources but leaves this
      # environment's state blob fully populated, describing resources that no
      # longer exist. A later re-provision would then start from a state full of
      # ghosts. Removing the blob keeps state and reality in step.
      #
      # This runs AFTER delete-rg (see `needs`) so the state is only discarded
      # once the resources it tracked are actually gone.
      #
      # The blob is SOFT-deleted: bootstrap-tfstate-azure.sh enables versioning and a
      # 30-day delete-retention on the account, so this stays recoverable for 30
      # days rather than being destroyed outright. That safety net is
      # deliberate — do not purge versions here.
      - name: Delete Terraform state blob
        id: state_blob
        env:
          APP_NAME:        ${{ needs.validate.outputs.app_name }}
          TARGET_ENV:      ${{ needs.validate.outputs.environment }}
          SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
        run: |
          set -euo pipefail

          # Must match the formula in scripts/bootstrap-tfstate-azure.sh exactly.
          APP_SHORT=$(echo "$APP_NAME"        | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-12)
          SUB_SHORT=$(echo "$SUBSCRIPTION_ID" | tr -d '-'                              | cut -c1-8)
          STORAGE_ACCOUNT="sttf${APP_SHORT}${SUB_SHORT}"
          BLOB="${TARGET_ENV}/terraform.tfstate"
          echo "State blob: ${STORAGE_ACCOUNT}/tfstate/${BLOB}"

          # Capture and classify rather than treating every failure as "absent":
          # a missing account is a normal outcome (the tfstate RG may already be
          # gone), but an auth or permission error must not masquerade as one.
          if ! EXISTS=$(az storage blob exists \
                          --account-name    "$STORAGE_ACCOUNT" \
                          --container-name  tfstate \
                          --name            "$BLOB" \
                          --auth-mode       login \
                          --query exists --output tsv 2>/tmp/blob-err.txt); then
            if grep -qiE "ResourceNotFound|StorageAccountNotFound|ContainerNotFound|does not exist|not found" /tmp/blob-err.txt; then
              STATUS="Skipped (state container not found)"
              echo "$STATUS"
            else
              STATUS="Error (see log)"
              echo "::warning::Could not query the state blob; it may need manual cleanup:"
              cat /tmp/blob-err.txt >&2
            fi
          elif [[ "$EXISTS" == "true" ]]; then
            az storage blob delete \
              --account-name   "$STORAGE_ACCOUNT" \
              --container-name tfstate \
              --name           "$BLOB" \
              --auth-mode      login \
              --output none
            STATUS="Deleted (soft-deleted, recoverable for 30 days)"
            echo "$STATUS"
          else
            STATUS="Not found"
            echo "$STATUS"
          fi

          echo "state_blob_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Remove OIDC federated credential
        env:
          APP_ID:        ${{ needs.validate.outputs.azure_client_id }}
          APP_REPO_FULL: ${{ needs.validate.outputs.app_repo_full }}
          TARGET_ENV:    ${{ needs.validate.outputs.environment }}
        run: |
          set -euo pipefail

          # The registered subject may be in the legacy form
          # (repo:owner/name:environment:env) or the immutable-ID form GitHub
          # uses for repos created after 2026-07-15
          # (repo:owner@123/name@456:environment:env). The app repo may
          # already be deleted here, so its actual format cannot be queried —
          # instead, stripping the @<id> markers canonicalises the immutable
          # form into the legacy one, and a single comparison matches both.
          # '@' cannot appear in owner, repo or environment names, so the
          # rewrite cannot touch anything else.
          SUBJECT="repo:${APP_REPO_FULL}:environment:${TARGET_ENV}"
          IDS=$(az ad app federated-credential list --id "$APP_ID" -o json 2>/dev/null \
                  | jq -r --arg s "$SUBJECT" \
                      '.[] | select(((.subject // "") | gsub("@[0-9]+"; "")) == $s) | .id' \
                  || true)
          if [[ -n "$IDS" ]]; then
            while IFS= read -r fid; do
              [[ -z "$fid" ]] && continue
              az ad app federated-credential delete --id "$APP_ID" --federated-credential-id "$fid"
            done <<< "$IDS"
          fi

      - name: Summary
        if: always()
        env:
          APP_NAME:        ${{ needs.validate.outputs.app_name }}
          ENVIRONMENT:     ${{ needs.validate.outputs.environment }}
          RESOURCE_GROUP:  ${{ needs.validate.outputs.resource_group_name }}
          RG_STATUS:       ${{ needs.delete-rg.outputs.resource_group_status }}
          BLOB_STATUS:     ${{ steps.state_blob.outputs.state_blob_status }}
        run: |
          {
            echo "## Delete App Resource Group"
            echo ""
            echo "- App name: $APP_NAME"
            echo "- Environment: $ENVIRONMENT"
            echo "- Resource group: $RESOURCE_GROUP"
            echo "- Resource group delete status: ${RG_STATUS:-Unknown}"
            echo "- Terraform state blob (\`$ENVIRONMENT/terraform.tfstate\`): ${BLOB_STATUS:-Unknown}"
            echo "- GitHub environment cleanup: executed"
            echo "- OIDC federated credential cleanup: executed"
          } >> "$GITHUB_STEP_SUMMARY"
