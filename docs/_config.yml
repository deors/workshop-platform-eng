# Jekyll configuration for the project's GitHub Pages site.
# Source is the `docs/` folder of the repository; the published site is the
# project's documentation hub plus the self-service provisioning forms — a
# cloud-agnostic entry point and one form per supported cloud.

# `description` is the subtitle the Cayman theme renders in every page header,
# and the fallback `<meta name="description">` for pages that don't declare
# their own. It must stay cloud-agnostic: it is shown on the shared pages too.
# Kept in sync with the front matter of `index.md`.
title:       Workshop · Platform Engineering
description: Self-service provisioning & reconciling application resources, multi-cloud, driven by GitHub Actions + Terraform.
theme:       jekyll-theme-cayman

# GitHub Pages whitelist already enables these. Listed explicitly so a local
# `bundle exec jekyll serve` matches the published build.
plugins:
  - jekyll-relative-links     # rewrites *.md links to their rendered URLs.
                              # ONLY runs on Markdown pages — links written in
                              # a .html page ship verbatim, so those must point
                              # at the final URL (`setup-azure/`, not
                              # `setup-azure.md`).
  - jekyll-readme-index       # makes a README.md inside source serve as index
  - jekyll-default-layout     # applies the theme's default layout to pages
                              # that don't declare one in front matter

# Render page.md at /page/ (not /page.html). jekyll-relative-links matches this.
permalink: pretty

# Don't ship Markdown files we don't want shown as standalone pages.
exclude:
  - _config.yml
  - README.md   # safety: index.md is the canonical home; if someone drops a
                # README.md inside docs/ we don't want it to clash.
